# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
      - master
      - release/6.0.x
      - release/5.0.x
      - release/4.0.x
  pull_request:
    branches:
      - master
      - release/6.0.x
      - release/5.0.x
      - release/4.0.x

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin
        cache: maven
        server-id: struts2-bootstrap.snapshots
    - name: Build
      run: mvn -B install
    - name: Deploy SNAPSHOT
      if: github.ref == 'refs/heads/release/6.0.x' || github.ref == 'refs/heads/release/5.0.x'
      run: |
        echo "${{ secrets.MAVEN_SETTINGS }}" > ~/.m2/settings-central.xml
        mvn -B -DskipTests=true deploy -s ~/.m2/settings-central.xml
